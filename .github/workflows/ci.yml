# Sentinel CI — test, lint, and security checks.
#
# Runs on every push to main and on every pull request. `main` is
# branch-protected: these checks are required before any PR can merge.
#
# Actions are pinned to full commit SHAs (not tags) so that a compromised
# release tag can never change what runs in CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check sentinel tests
      - name: Format check
        run: ruff format --check sentinel tests

  package:
    # Builds a wheel and runs the CLI from the *installed* distribution.
    # This catches packaging regressions (e.g. a subpackage missing from the
    # wheel) that editable installs (`pip install -e .`) never see.
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          pip install --upgrade pip setuptools wheel build
          python -m build --wheel
      - name: Install wheel into a clean venv
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/pip install dist/*.whl
      - name: Smoke-test installed CLI
        run: |
          .venv-wheel/bin/sentinel --version
          .venv-wheel/bin/sentinel --help | grep -q upgrade
          .venv-wheel/bin/sentinel upgrade --help | grep -q -- '--dry-run'
          SENTINEL_HOME="$(mktemp -d)" .venv-wheel/bin/sentinel config --path

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install project and security tooling
        run: |
          pip install -e .
          pip install --upgrade pip setuptools wheel bandit pip-audit
      - name: Bandit static analysis
        run: bandit -q -r sentinel
      - name: pip-audit (dependency vulnerabilities)
        # Audits the installed environment: the project itself (zero runtime
        # deps) plus a current build toolchain. The runner's stale bundled
        # setuptools is upgraded first so it cannot fail the gate.
        run: pip-audit --local
