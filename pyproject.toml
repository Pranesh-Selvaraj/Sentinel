[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cli"
version = "0.2.0"
description = "Sentinel — a universal source & software change monitor"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sentinel Contributors" }]
keywords = ["monitoring", "cli", "github", "releases", "watch", "developer-tools"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
# Include every subpackage (monitors, updaters, …) so an installed wheel
# behaves exactly like the source tree. Missing a subpackage here breaks
# every command (sentinel.cli imports sentinel.app → sentinel.updaters).
include = ["sentinel*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S", "BLE", "FURB", "DTZ"]
ignore = [
    "S101",   # asserts are fine in tests
    "S311",   # random jitter in retry backoff is intentional
    "DTZ005", # watch-mode timestamps intentionally use local time
    "RUF001", # deliberate Unicode arrows in the TUI
]

[tool.ruff.lint.per-file-ignores]
# Registration imports after class definitions are intentional (side effects).
"sentinel/monitors/__init__.py" = ["E402"]
"sentinel/updaters/__init__.py" = ["E402"]
